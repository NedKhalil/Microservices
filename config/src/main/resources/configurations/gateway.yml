eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    

server:
  port: 8222

spring:
  application:
    name: gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      mvc:
        routes:
          - id: accounts
            uri: http://localhost:8090
            predicates:
              - Path=/api/v1/accounts/**
          - id: customers
            uri: http://localhost:8070
            predicates:
              - Path=/api/v1/customers/**

management:
  tracing:
    sampling:
      probability: 1.0